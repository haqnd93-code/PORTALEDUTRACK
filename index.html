<!DOCTYPE html>
<html lang="ms">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>EduTrack</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --primary:#6366f1; --primary-dark:#4f46e5; --purple:#8b5cf6; --purple2:#a855f7;
  --success:#10b981; --warning:#f59e0b; --danger:#ef4444;
  --bg:#f1f5f9; --text:#1e293b; --border:#e2e8f0; --muted:#94a3b8;
  --navy:#0f172a; --navy2:#1e293b;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;position:relative;overflow-x:hidden;}

.bg-blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.32;z-index:0;pointer-events:none;}
.b1{width:460px;height:460px;background:linear-gradient(135deg,var(--primary),var(--purple));top:-180px;right:-150px;}
.b2{width:420px;height:420px;background:linear-gradient(135deg,var(--purple2),var(--primary));bottom:-190px;left:-160px;}

.page-wrap{position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}

.login-card{width:420px;max-width:100%;background:#fff;border-radius:28px;box-shadow:0 20px 60px rgba(15,23,42,.14);border:1px solid var(--border);overflow:hidden;animation:cardIn .5s ease;}
@keyframes cardIn{from{opacity:0;transform:translateY(16px);}to{opacity:1;transform:translateY(0);}}

.login-hero{background:linear-gradient(135deg,var(--primary) 0%,var(--purple) 55%,var(--purple2) 100%);padding:38px 32px 30px;text-align:center;color:#fff;position:relative;overflow:hidden;}
.login-hero::before{content:'';position:absolute;top:-45%;right:-18%;width:220px;height:220px;background:rgba(255,255,255,.08);border-radius:50%;}
.login-hero::after{content:'';position:absolute;bottom:-40%;left:-10%;width:180px;height:180px;background:rgba(255,255,255,.05);border-radius:50%;}
.login-logo{width:62px;height:62px;border-radius:18px;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-size:1.6rem;margin:0 auto 14px;border:1px solid rgba(255,255,255,.3);position:relative;z-index:1;}
.login-hero h1{font-size:1.45rem;font-weight:800;position:relative;z-index:1;letter-spacing:-.01em;}
.login-hero p{font-size:.82rem;opacity:.88;margin-top:5px;position:relative;z-index:1;}

.login-body{padding:30px 32px 26px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:7px;}
.field input{width:100%;padding:12px 15px;border-radius:14px;border:1.5px solid var(--border);font-size:.9rem;font-family:inherit;background:#f8fafc;transition:.15s;}
.field input:focus{outline:none;border-color:var(--primary);background:#fff;box-shadow:0 0 0 4px rgba(99,102,241,.12);}
.pass-field{position:relative;}
.pass-toggle{position:absolute;right:13px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--muted);font-size:.9rem;}

.btn-login{width:100%;padding:13px;border-radius:14px;background:var(--primary);color:#fff;font-weight:700;font-size:.88rem;border:none;cursor:pointer;transition:.15s;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:4px;}
.btn-login:hover{background:var(--primary-dark);}
.btn-login:disabled{opacity:.6;cursor:default;}

.msg{margin-top:14px;padding:11px 14px;border-radius:12px;font-size:.8rem;font-weight:600;display:none;align-items:center;gap:8px;}
.msg.show{display:flex;}
.msg.error{background:#fee2e2;color:#991b1b;}
.msg.success{background:#d1fae5;color:#065f46;}

.help-text{text-align:center;font-size:.76rem;color:var(--muted);margin-top:18px;line-height:1.55;}

.admin-link{position:fixed;bottom:22px;right:22px;width:46px;height:46px;border-radius:50%;background:#fff;border:1.5px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(0,0,0,.08);font-size:1.05rem;color:var(--muted);z-index:2;transition:.15s;}
.admin-link:hover{color:var(--primary);border-color:var(--primary);}

.modal-overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.6);backdrop-filter:blur(6px);z-index:1000;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.show{display:flex;}
.modal-box{background:#fff;border-radius:24px;width:680px;max-width:100%;max-height:88vh;overflow-y:auto;padding:26px;animation:cardIn .3s ease;}
.modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
.modal-head h2{font-size:1.05rem;font-weight:800;display:flex;align-items:center;gap:9px;}
.modal-close{background:#f1f5f9;border:none;width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:.95rem;color:#64748b;flex-shrink:0;}
.modal-close:hover{background:var(--border);}

.auth-box{max-width:340px;margin:10px auto 4px;text-align:center;}
.auth-box i{font-size:2rem;color:var(--primary);margin-bottom:10px;display:block;}
.auth-box p{font-size:.83rem;color:var(--muted);margin-bottom:16px;}

.btn{padding:10px 18px;border-radius:12px;cursor:pointer;font-weight:700;font-size:.82rem;border:none;display:inline-flex;align-items:center;gap:7px;transition:.15s;}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-dark);}
.btn-ghost{background:transparent;color:#64748b;border:1.5px solid var(--border);}
.btn-ghost:hover{border-color:#94a3b8;}
.btn-danger{background:#fee2e2;color:#991b1b;}
.btn-danger:hover{background:#fecaca;}
.btn-success{background:var(--success);color:#fff;}

.section-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--muted);margin:18px 0 10px;}
.teacher-row{display:grid;grid-template-columns:1fr 1fr 1.4fr auto;gap:8px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:14px;margin-bottom:8px;font-size:.82rem;background:#f8fafc;}
.teacher-row .cell-name{font-weight:700;}
.teacher-row .cell-url{color:var(--primary);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.teacher-row .row-actions{display:flex;gap:6px;justify-self:end;}
.icon-btn{width:30px;height:30px;border-radius:9px;border:1.5px solid var(--border);background:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.78rem;color:#64748b;}
.icon-btn:hover{border-color:var(--primary);color:var(--primary);}
.icon-btn.del:hover{border-color:var(--danger);color:var(--danger);}

.add-form{display:none;grid-template-columns:1fr 1fr;gap:10px;padding:16px;border:1.5px dashed var(--border);border-radius:16px;margin-bottom:14px;background:#fafbff;}
.add-form.show{display:grid;}
.add-form .full{grid-column:1/-1;}
.add-form label{font-size:.68rem;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.04em;display:block;margin-bottom:5px;}
.add-form input{width:100%;padding:10px 13px;border-radius:11px;border:1.5px solid var(--border);font-size:.85rem;font-family:inherit;background:#fff;}
.add-form input:focus{outline:none;border-color:var(--primary);}
.add-form .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-end;margin-top:2px;}

.empty-state{text-align:center;padding:26px 10px;color:var(--muted);font-size:.85rem;}
.empty-state i{font-size:1.8rem;display:block;margin-bottom:8px;color:var(--border);}

.top-actions{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:4px;}
.top-actions .badge-count{font-size:.72rem;font-weight:700;color:var(--muted);}
.settings-line{display:flex;justify-content:space-between;align-items:center;padding:12px 4px;border-top:1px solid var(--border);margin-top:16px;}
.settings-line span{font-size:.82rem;font-weight:600;}
</style>
</head>
<body>

<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>

<div class="page-wrap">
  <div class="login-card">
    <div class="login-hero">
      <div class="login-logo"><i class="fas fa-graduation-cap"></i></div>
      <h1>EduTrack</h1>
      <p>Memperkasa Institusi, Menjana Generasi Berprestasi</p>
    </div>
    <div class="login-body">
      <form id="loginForm">
        <div class="field">
          <label>Username</label>
          <input type="text" id="username" autocomplete="username" placeholder="Contoh: cikguali">
        </div>
        <button type="submit" class="btn-login" id="loginBtn"><i class="fas fa-right-to-bracket"></i> Log Masuk</button>
        <div class="msg" id="loginMsg"></div>
      </form>
      <p class="help-text">Masukkan username yang diberikan oleh admin sekolah anda. Anda akan dialihkan secara automatik ke sistem EduTrack anda sendiri di tab baharu.</p>
    </div>
  </div>
</div>

<script>
/* ============================================================
   SENARAI GURU — edit terus di sini untuk tambah/ubah/padam guru.
   Salin-tampal satu blok { ... } baharu untuk setiap guru.
   Tiada storan luaran digunakan — semua data ada dalam fail ini.
   ============================================================ */
const teachers = [
  {
    nama: 'Cikgu Ali',
    username: 'cikguali',
    url: 'https://cikguali-edutrack.example.com'
  },
  {
    nama: 'Cikgu Siti',
    username: 'cikgusiti',
    url: 'https://cikgusiti-edutrack.example.com'
  },
  {
    nama: 'NASRULHAQ',
    username: 'HAQHENSEM',
    url: 'https://pbd-202661.vercel.app/'
  },
  {
    nama: 'ZUHAIMI AWANG',
    username: 'ZUHAIMI',
    url: 'https://edutrack-zuhaimi.vercel.app/'
  },
  // Tambah guru baharu di sini, ikut format di atas, pisahkan dengan koma.
];

const $ = id => document.getElementById(id);

function normalizeUrl(u){
  u = (u||'').trim();
  if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u = 'https://' + u;
  return u;
}

function showMsg(el, type, text){
  el.className = 'msg show ' + type;
  el.innerHTML = (type==='error' ? '<i class="fas fa-circle-exclamation"></i> ' : '<i class="fas fa-circle-check"></i> ') + text;
}
function hideMsg(el){ el.className = 'msg'; el.innerHTML=''; }

/* ===== LOGIN ===== */

$('loginForm').addEventListener('submit', (e)=>{
  e.preventDefault();
  const msg = $('loginMsg');
  hideMsg(msg);
  const u = $('username').value.trim();
  if(!u){ showMsg(msg,'error','Sila isi username.'); return; }

  const btn = $('loginBtn');
  btn.disabled = true; btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Menyemak...';

  const match = teachers.find(t => t.username.toLowerCase() === u.toLowerCase());

  btn.disabled = false; btn.innerHTML = '<i class="fas fa-right-to-bracket"></i> Log Masuk';

  if(!match){ showMsg(msg,'error','Username tidak dijumpai.'); return; }
  const url = normalizeUrl(match.url);
  if(!url){ showMsg(msg,'error','URL web untuk guru ini belum ditetapkan. Sila hubungi admin.'); return; }

  showMsg(msg,'success', 'Log masuk berjaya! Mengalihkan ke portal ' + (match.nama || match.username) + '...');
  setTimeout(()=>{ window.open(url, '_blank'); }, 800);
});


</script>
</body>
</html>
